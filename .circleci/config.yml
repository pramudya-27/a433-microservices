version: 2.1

executors:
  docker-publisher:
    environment:
      IMAGE_NAME_FRONTEND: ghcr.io/pramudya-27/karsajobs-ui
    docker:
      - image: cimg/go:1.20 # Image dasar

jobs:
  # Linter Dockerfile
  lint-dockerfile:
    docker:
      - image: cimg/go:1.20
    steps:
      - checkout
      - run:
          name: Install Hadolint
          command: |
             sudo wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
             sudo chmod +x /usr/local/bin/hadolint
      - run:
          name: Lint Dockerfile Frontend
          command: hadolint Dockerfile

  # Execute Script bash untuk build dan push
  build-push-image:
    executor: docker-publisher
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Execute Build and Push Script
          command: bash build_push_image_karsajobs_ui.sh

workflows:
  version: 2
  frontend-workflow:
    jobs:
      - lint-dockerfile
      - build-push-image:
          requires:
            - lint-dockerfile
